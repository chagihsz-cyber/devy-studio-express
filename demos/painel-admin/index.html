<title>Central Admin — demonstração C.B.S. Desenvolvimento</title>
<style>
:root{--bg:#f4f5f0;--paper:#fff;--ink:#192c22;--muted:#728078;--line:#dfe5dd;--green:#176344;--lime:#daf292;--red:#b2443b;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #77ad5d;outline-offset:3px}button{border:0}button:disabled{cursor:not-allowed;opacity:.5}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.side{background:#142b20;color:#b9cbbd;position:fixed;width:224px;inset:0 auto 0 0;padding:30px 18px 20px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;gap:12px;align-items:center;color:#fff;font-size:19px;font-weight:750;letter-spacing:-.7px}.mark{display:grid;place-items:center;width:36px;height:36px;background:var(--lime);color:#19341f;border-radius:10px;font-size:23px;font-weight:900}.brand small{display:block;font-size:10px;font-weight:400;color:#9db4a4;letter-spacing:1.5px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{color:#bdd0c1;background:transparent;text-align:left;border-radius:7px;padding:12px;display:flex;gap:11px;align-items:center;font-size:12px}.nav button:hover{background:#223f2c}.nav button.active{color:#1d3420;background:var(--lime);font-weight:700}.nav svg{width:17px;height:17px;flex-shrink:0}.side-foot{margin-top:auto;padding:18px 10px 0;border-top:1px solid #365140;font-size:11px;line-height:1.7}.main{grid-column:2;min-width:0}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#ffffffa0;gap:15px}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:500;margin-left:10px}.owner{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{background:#e6eddc;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:700}.owner small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.content{padding:28px 34px 42px;max-width:1600px;margin:auto}.notice{border:1px solid #d7e4c4;background:#ecf3e2;border-radius:7px;color:#526943;padding:10px 13px;font-size:11px;margin-bottom:28px;display:flex;gap:8px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#689346;flex-shrink:0}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 24px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:var(--green);font-weight:700}h1{font-size:29px;letter-spacing:-1px;margin:8px 0 7px;line-height:1.2}h2{font-size:15px;letter-spacing:-.25px;margin:0}p{line-height:1.6}.sub{margin:0;font-size:12px;color:var(--muted)}.btn{background:var(--green);border:1px solid var(--green);color:white;border-radius:7px;padding:10px 15px;font-size:12px;font-weight:600;white-space:nowrap}.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.btn.small{font-size:11px;padding:7px 10px}.btn.danger{color:var(--red);background:#fff4f1;border-color:#edcfc9}.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;padding:6px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:20px}.metric .label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.metric strong{display:block;font-size:30px;font-weight:650;letter-spacing:-1px;margin:10px 0}.metric small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px;gap:12px;border-bottom:1px solid var(--line)}.panel-head small{color:var(--muted);font-size:10px}.panel-body{padding:20px}.chart{height:195px;display:flex;align-items:end;gap:18px;padding:10px 5px 0;border-bottom:1px solid var(--line)}.bar{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:8px;min-width:0}.bar i{display:block;background:#75a66c;width:65%;max-width:45px;border-radius:4px 4px 0 0;min-height:3px}.bar span{font-size:10px;color:var(--muted);margin-bottom:10px}.bar b{font-size:11px;color:#546d4f;font-weight:500}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eef0eb;font-size:12px}.row:last-child{border:0}.row strong{font-size:12px;font-weight:600}.row small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}.row .grow{flex:1}.badge{display:inline-flex;align-items:center;gap:5px;background:#edf3e6;color:#436235;border-radius:20px;padding:5px 9px;font-size:10px;white-space:nowrap}.badge.wait{background:#fff3d8;color:#8c6820}.badge.off{background:#f7e9e5;color:#985348}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.input,select,textarea{background:white;border:1px solid #d3dcd1;color:var(--ink);border-radius:7px;padding:10px 12px;min-width:0}.input{width:260px}.toolbar .count{margin-left:auto;font-size:11px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{padding:13px 18px;background:#fafbf8;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.3px}td{padding:15px 18px;border-bottom:1px solid #edf0e9;font-size:12px}tr:last-child td{border-bottom:0}td small{display:block;font-size:10px;margin-top:4px;color:var(--muted)}td.actions{text-align:right;white-space:nowrap}.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}.toggle{min-width:40px;width:40px;height:23px;border-radius:20px;background:#c5cec2;padding:3px;display:flex;align-items:center;transition:background .15s}.toggle span{display:block;width:17px;height:17px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002}.toggle.on{background:var(--green);justify-content:end}.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.tabs button{background:transparent;color:var(--muted);font-size:12px;padding:9px 14px;border-radius:6px}.tabs button.active{background:#e1ead7;color:var(--green);font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.help{font-size:11px;color:var(--muted);line-height:1.7;margin:16px 0 0}.split-stat{display:flex;gap:25px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.split-stat small{font-size:10px;color:var(--muted);display:block}.split-stat b{font-size:18px;display:block;margin-top:5px}dialog{border:1px solid var(--line);border-radius:12px;width:min(560px,calc(100% - 32px));padding:0;color:var(--ink);box-shadow:0 30px 90px #13241833}dialog::backdrop{background:#15291f80;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid var(--line)}.dialog-body{padding:6px 24px 22px;max-height:70vh;overflow:auto}.field{display:grid;gap:7px;margin-top:17px;font-size:11px;font-weight:600}.field input,.field select,.field textarea{font-size:13px;width:100%;font-weight:400}.field textarea{min-height:85px;resize:vertical}.dialog-foot{display:flex;gap:9px;justify-content:flex-end;padding:17px 24px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173d29;color:white;border-radius:8px;box-shadow:0 6px 25px #0002;padding:13px 20px;font-size:12px;z-index:100;max-width:calc(100% - 30px)}.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:#142b20}.login-box{background:var(--bg);border-radius:14px;padding:40px;max-width:440px;width:100%;box-shadow:0 20px 100px #0003}.login-box .mark{margin-bottom:26px}.login-box h1{font-size:32px}.login-box .btn{width:100%;margin-top:18px;padding:13px}.login-box .help{font-size:12px}.mobile-menu{display:none}.mini-tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;background:#e9efdf;border-radius:4px;padding:5px 7px;color:#5d754c}.admin-role{background:#d8e8cb;padding:5px 9px;font-size:10px;border-radius:5px}.company-name{background:transparent;padding:0;color:var(--green);font:inherit;text-align:left;font-weight:650;text-decoration:underline;text-underline-offset:3px}
@media(min-width:1500px){.content{padding-top:35px}}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr}.owner small{display:none}.top,.content{padding-left:22px;padding-right:22px}}@media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none;width:224px;box-shadow:20px 0 70px #0003;z-index:40}.side.open{display:flex}.main{grid-column:1}.mobile-menu{display:block}.top{height:65px;padding:0 16px}.content{padding:20px 16px 35px}.owner .owner-name,.admin-role{display:none}.head{align-items:start}.head h1{font-size:25px}.cards{gap:10px}.metric{padding:15px}.metric strong{font-size:26px}.toolbar .input{width:100%}.toolbar select{max-width:100%}.notice{line-height:1.6;font-size:10px}.login-box{padding:30px}.chart{gap:10px}}
/* Impeccable: foco e toque na demonstração pública. */
:where(a,button,input,select,textarea):focus-visible{outline:3px solid #35b88d!important;outline-offset:3px!important}
:where(button,[role="button"]){touch-action:manipulation}
@media(max-width:700px){button.btn{min-height:44px}.mobile-menu{min-width:44px;min-height:44px}}
@media(prefers-reduced-motion:reduce){.btn,.panel,.card{transition:none!important;animation:none!important}}
</style>
<div id="app"></div><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='cbs_admin_demo_cache_v1';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const labels={ACTIVE:'Ativo',PENDING:'Pendente',BLOCKED:'Bloqueado',INACTIVE:'Desativado',APPROVED:'Aprovado',REVOKED:'Revogado',COMPLETED:'Concluída',CANCELED:'Cancelada',OPEN:'Em aberto',PAID:'Pago',DRAFT:'Rascunho',PUBLISHED:'Publicado',SCHEDULED:'Agendado'};
const label=x=>labels[x]||x;
const badge=x=>`<span class="badge ${['PENDING','OPEN','DRAFT','SCHEDULED'].includes(x)?'wait':['BLOCKED','INACTIVE','REVOKED','CANCELED'].includes(x)?'off':''}">${esc(label(x))}</span>`;
const clone=x=>JSON.parse(JSON.stringify(x));
const date=new Date().toISOString().slice(0,10);
function seed(){return{version:1,users:[{id:'u1',name:'Ana Oliveira',email:'ana@example.test',role:'Usuário',status:'ACTIVE',social:'ACTIVE',marketplace:'ACTIVE'},{id:'u2',name:'Bruno Santos',email:'bruno@example.test',role:'Parceiro',status:'APPROVED',social:'ACTIVE',marketplace:'ACTIVE'},{id:'u3',name:'Carla Lima',email:'carla@example.test',role:'Parceiro',status:'PENDING',social:'ACTIVE',marketplace:'PENDING'},{id:'u4',name:'Diego Alves',email:'diego@example.test',role:'Usuário',status:'ACTIVE',social:'BLOCKED',marketplace:'ACTIVE'},{id:'u5',name:'Elisa Costa',email:'elisa@example.test',role:'Usuário',status:'PENDING',social:'ACTIVE',marketplace:'ACTIVE'},{id:'u6',name:'Felipe Rocha',email:'felipe@example.test',role:'Usuário',status:'REVOKED',social:'BLOCKED',marketplace:'BLOCKED'}],companies:[{id:'c1',name:'Empresa Horizonte',city:'Cidade Exemplo',status:'APPROVED',contact:'horizonte@example.test'},{id:'c2',name:'Comércio Alameda',city:'Cidade Exemplo',status:'APPROVED',contact:'alameda@example.test'},{id:'c3',name:'Parceiro Central',city:'Cidade Exemplo',status:'PENDING',contact:'central@example.test'}],rides:Array.from({length:12},(_,i)=>({id:'r'+(i+1),company:i%3===2?'c3':i%2?'c2':'c1',rider:['Ana Oliveira','Bruno Santos','Diego Alves'][i%3],origin:'Origem de exemplo '+(i+1),destination:'Destino de exemplo '+(i+1),date:date,km:2+i*.6,value:12+i*2,status:i===10?'OPEN':i===11?'CANCELED':'COMPLETED',payment:i%3?'PAID':'OPEN'})),products:[{id:'p1',title:'Capacete de exemplo',seller:'Bruno Santos',price:180,status:'ACTIVE'},{id:'p2',title:'Suporte para celular',seller:'Carla Lima',price:55,status:'PENDING'},{id:'p3',title:'Mochila de entrega',seller:'Ana Oliveira',price:140,status:'ACTIVE'},{id:'p4',title:'Acessório de exemplo',seller:'Diego Alves',price:35,status:'BLOCKED'}],posts:[{id:'s1',title:'Novidades da comunidade',author:'Ana Oliveira',status:'PUBLISHED'},{id:'s2',title:'Dica de organização no trabalho',author:'Bruno Santos',status:'PUBLISHED'},{id:'s3',title:'Conteúdo aguardando revisão',author:'Carla Lima',status:'PENDING'}],chats:[{id:'ch1',name:'Atendimento de exemplo 01',status:'OPEN'},{id:'ch2',name:'Atendimento de exemplo 02',status:'OPEN'},{id:'ch3',name:'Atendimento de exemplo 03',status:'COMPLETED'}],modules:{'Trabalho':true,'Social':true,'Marketplace':true,'Apoio':true,'Parceiros':true},apis:{'Mapas e rotas':true,'Notificações push':true,'Pagamentos':false,'Login externo':false,'Assistente de IA':false},notifications:[{id:'n1',title:'Bem-vindo à plataforma',audience:'Todos',message:'Mensagem fictícia de boas-vindas.',status:'DRAFT'}],highlights:[{id:'h1',title:'Destaque da semana',audience:'Todos',message:'Conteúdo de exemplo para a tela inicial.',status:'PUBLISHED'}],ads:[{id:'a1',title:'Campanha de exemplo',advertiser:'Empresa Horizonte',budget:250,placement:'Tela inicial',status:'ACTIVE'}],settings:{name:'Central Admin',baseFare:7,perKm:2.5,monthlyCost:180,monthlyRevenue:950},audit:[{at:new Date().toISOString(),action:'Demonstração iniciada com dados fictícios.'}]}}
let db,cacheOK=true;
try{const saved=localStorage.getItem(KEY);db=saved?JSON.parse(saved):seed();if(!db||db.version!==1||!Array.isArray(db.users)||!db.settings)throw Error('cache inválido')}catch{db=seed()}
let page='overview',tab='products',query='',companyFilter='',statusFilter='',entered=false,toastTimer;
const app=document.getElementById('app'),modal=document.getElementById('modal');
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3300)}
function save(action){db.audit.unshift({at:new Date().toISOString(),action});db.audit=db.audit.slice(0,100);try{localStorage.setItem(KEY,JSON.stringify(db));cacheOK=true}catch{cacheOK=false}render();toast(cacheOK?'Salvo neste navegador.':'O navegador não permitiu salvar o cache. As alterações duram nesta aba.')}
const pathIcon={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',companies:'M3 21h18 M5 21V4h10v17 M15 10h4v11 M8 8h4 M8 12h4 M8 16h4',rides:'M3 17h2 M19 17h2 M5 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0 M13 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0 M8 14l4-8h4 M9 6H6 M12 6l4 8',moderation:'M12 3l8 4v5c0 5-8 9-8 9s-8-4-8-9V7z M8 12l3 3 5-6',tools:'M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6',communications:'M3 6h18v12H3z M3 6l9 7 9-7',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M3 12h3 M18 12h3 M12 3v3 M12 18v3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',audit:'M8 3h8v4H8z M8 5H5v16h14V5h-3 M8 11h8 M8 15h6'};
const names={overview:'Visão geral',users:'Usuários e aprovações',companies:'Empresas e parceiros',rides:'Corridas e valores',moderation:'Conteúdo e perfis',tools:'Ferramentas e APIs',communications:'Comunicação e anúncios',settings:'Configurações',audit:'Histórico de alterações'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${pathIcon[k]}"></path></svg>`;
function login(){app.innerHTML=`<div class="login"><div class="login-box"><div class="mark">C</div><span class="eyebrow">C.B.S. Desenvolvimento · demonstração</span><h1>Seu negócio.<br>Uma visão completa.</h1><p class="sub">Painel exclusivo do proprietário para conhecer os controles da plataforma.</p><button class="btn" data-act="enter">Entrar na demonstração →</button><p class="help">Acesso demonstrativo, sem senha. Todos os dados são fictícios. As alterações ficam somente no cache deste navegador.</p></div></div>`}
function go(next){page=next;query='';companyFilter='';statusFilter='';if(next==='moderation')tab='products';if(next==='communications')tab='notifications';render()}
function heading(title,desc,action=''){return`<div class="head"><div><div class="eyebrow">Administração do proprietário</div><h1>${esc(title)}</h1><p class="sub">${esc(desc)}</p></div>${action}</div>`}
function render(){if(!entered)return login();app.innerHTML=`<div class="shell"><aside class="side" id="sidebar"><div class="brand"><div class="mark">C</div><div>${esc(db.settings.name)}<small>CONSOLE DO DONO</small></div></div><nav class="nav" aria-label="Navegação principal">${Object.entries(names).map(([k,n])=>`<button data-page="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}>${icon(k)}${n}</button>`).join('')}</nav><div class="side-foot"><span class="dot" style="display:inline-block;margin-right:5px"></span> Ambiente demonstrativo<br>C.B.S. Desenvolvimento · dados locais<br><button class="btn ghost" data-act="reset" style="color:#bed0bd;padding-left:0;margin-top:8px">Restaurar dados da demo</button></div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary small mobile-menu" aria-label="Abrir menu" data-act="menu">☰</button><div class="crumb">Painel <b>/ ${names[page]}</b></div></div><div class="owner"><span class="admin-role">Proprietário</span><div class="avatar">AD</div><div class="owner-name">Administrador<small>Acesso global demonstrativo</small></div><button class="btn ghost" data-act="exit">Sair</button></div></header><div class="content"><div class="notice"><span class="dot"></span>${cacheOK?'Demonstração · dados fictícios · alterações salvas neste navegador':'Cache indisponível · alterações temporárias nesta aba'}</div><div id="view">${view()}</div></div></main></div>`}
function view(){return({overview,users:usersView,companies:companiesView,rides:ridesView,moderation:moderationView,tools:toolsView,communications:communicationsView,settings:settingsView,audit:auditView})[page]()}
function metric(title,value,foot){return`<div class="metric"><div class="label">${title}<span>↗</span></div><strong>${value}</strong><small>${foot}</small></div>`}
function overview(){const active=db.users.filter(u=>['ACTIVE','APPROVED'].includes(u.status)).length,done=db.rides.filter(r=>r.status==='COMPLETED'),total=done.reduce((s,r)=>s+Number(r.value),0),per=active?db.settings.monthlyCost/active:0;return heading('Visão geral','Acompanhe a atividade e os números da sua plataforma.',`<span class="mini-tag">Dados de demonstração</span>`)+`<div class="cards">${metric('Usuários ativos',active,db.users.length+' contas cadastradas')}${metric('Empresas aprovadas',db.companies.filter(x=>x.status==='APPROVED').length,db.companies.length+' empresas cadastradas')}${metric('Corridas concluídas',done.length,money(total)+' em valores de corridas')}${metric('Custo estimado / ativo',money(per),active?'Estimativa mensal configurável':'Sem usuários ativos')}</div><div class="grid"><div class="panel"><div class="panel-head"><h2>Corridas por empresa</h2><small>Registros salvos na demo</small></div><div class="panel-body"><div class="chart">${db.companies.map(c=>{let n=db.rides.filter(r=>r.company===c.id&&r.status==='COMPLETED').length;return`<div class="bar"><b>${n}</b><i style="height:${Math.max(3,n/Math.max(1,...db.companies.map(c=>db.rides.filter(r=>r.company===c.id&&r.status==='COMPLETED').length))*120)}px"></i><span>${esc(c.name.split(' ').slice(0,2).join(' '))}</span></div>`}).join('')}</div><p class="help">Clique em Empresas e parceiros para consultar as corridas de cada empresa.</p></div></div><div class="panel"><div class="panel-head"><h2>Atividade da plataforma</h2><small>Cache local</small></div><div class="panel-body">${[['Chats abertos',db.chats.filter(c=>c.status==='OPEN').length],['Posts publicados',db.posts.filter(p=>p.status==='PUBLISHED').length],['Produtos ativos',db.products.filter(p=>p.status==='ACTIVE').length],['Aguardando aprovação',db.users.filter(u=>u.status==='PENDING').length+db.companies.filter(c=>c.status==='PENDING').length]].map(([n,v])=>`<div class="row"><span>${n}</span><strong>${v}</strong></div>`).join('')}</div></div></div><div class="cards" style="margin-top:20px">${metric('Custo mensal estimado',money(db.settings.monthlyCost),'Valor definido nas configurações')}${metric('Receita mensal estimada',money(db.settings.monthlyRevenue),'Valor fictício informado manualmente')}${metric('Módulos habilitados',Object.values(db.modules).filter(Boolean).length,Object.keys(db.modules).length+' ferramentas disponíveis')}${metric('APIs habilitadas',Object.values(db.apis).filter(Boolean).length,'Chaves e conexões não são utilizadas')}</div>`}
function toolbar(filters=''){return`<div class="toolbar"><input id="search" class="input" type="search" placeholder="Buscar nesta lista…" aria-label="Buscar nesta lista" value="${esc(query)}">${filters}<span class="count">Dados fictícios editáveis</span></div>`}
function table(headers,rows){return`<div class="panel table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`}
const matches=x=>JSON.stringify(x).toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR'));
const editBtn=(kind,id,text='Editar')=>`<button class="btn secondary small" data-edit="${kind}" data-id="${id}">${text}</button>`;
const newBtn=(kind,text)=>`<button class="btn" data-edit="${kind}">${text}</button>`;
function usersView(){return heading('Usuários e aprovações','Aprove, revogue acessos e controle perfis de usuários e parceiros.',newBtn('users','+ Novo usuário'))+toolbar()+table(['Pessoa','Tipo','Aprovação','Social / Marketplace','Ações'],db.users.filter(matches).map(u=>`<tr><td><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></td><td>${esc(u.role)}</td><td>${badge(u.status)}</td><td>${badge(u.social)} ${badge(u.marketplace)}</td><td class="actions">${u.status==='PENDING'?`<button class="btn small" data-approve="users" data-id="${u.id}">Aprovar</button> `:''}${editBtn('users',u.id)}</td></tr>`))}
function companiesView(){return heading('Empresas e parceiros','Cada empresa mantém sua própria lista de corridas salvas.',newBtn('companies','+ Nova empresa'))+toolbar()+table(['Empresa','Situação','Corridas salvas','Valor total','Ações'],db.companies.filter(matches).map(c=>{let rides=db.rides.filter(r=>r.company===c.id);return`<tr><td><button class="company-name" data-company="${c.id}">${esc(c.name)}</button><small>${esc(c.contact)}</small></td><td>${badge(c.status)}</td><td>${rides.length}</td><td>${money(rides.reduce((s,r)=>s+Number(r.value),0))}</td><td class="actions">${editBtn('companies',c.id)} <button class="btn small" data-company="${c.id}">Ver corridas</button></td></tr>`}))}
function ridesView(){let rows=db.rides.filter(r=>(!companyFilter||r.company===companyFilter)&&(!statusFilter||r.status===statusFilter)&&matches({...r,companyName:db.companies.find(c=>c.id===r.company)?.name}));let opts=`<select id="company-filter" aria-label="Filtrar por empresa"><option value="">Todas as empresas</option>${db.companies.map(c=>`<option value="${c.id}" ${companyFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="status-filter" aria-label="Filtrar situação da corrida"><option value="">Todas as situações</option>${['OPEN','COMPLETED','CANCELED'].map(x=>`<option value="${x}" ${statusFilter===x?'selected':''}>${label(x)}</option>`).join('')}</select>`;return heading('Corridas e valores','Consulte por empresa e edite os dados e valores de cada corrida.',newBtn('rides','+ Nova corrida'))+toolbar(opts)+`<div class="panel" style="margin-bottom:16px"><div class="split-stat"><div><small>Corridas nesta seleção</small><b>${rows.length}</b></div><div><small>Valor desta seleção</small><b>${money(rows.reduce((s,r)=>s+Number(r.value),0))}</b></div><div><small>Pagamento em aberto</small><b>${money(rows.filter(r=>r.payment==='OPEN').reduce((s,r)=>s+Number(r.value),0))}</b></div></div></div>`+table(['Corrida / data','Empresa','Condutor / destino','Distância','Valor','Situação','Ações'],rows.map(r=>`<tr><td><strong>#${esc(r.id.replace('r','').slice(-6))}</strong><small>${esc(r.date.split('-').reverse().join('/'))}</small></td><td>${esc(db.companies.find(c=>c.id===r.company)?.name||'Empresa removida')}</td><td>${esc(r.rider)}<small>${esc(r.destination)}</small></td><td>${Number(r.km).toLocaleString('pt-BR')} km</td><td><strong>${money(r.value)}</strong><small>${label(r.payment)}</small></td><td>${badge(r.status)}</td><td class="actions">${editBtn('rides',r.id,'Editar corrida')}</td></tr>`))}
function tabs(kinds){return`<div class="tabs">${Object.entries(kinds).map(([k,t])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${t}</button>`).join('')}</div>`}
function moderationView(){let out=heading('Conteúdo e perfis','Edite publicações, produtos e controle bloqueios na plataforma.')+tabs({products:'Marketplace',posts:'Social',chats:'Chats'});if(tab==='products')return out+toolbar()+table(['Produto','Vendedor','Preço','Situação','Ações'],db.products.filter(matches).map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.seller)}</td><td>${money(p.price)}</td><td>${badge(p.status)}</td><td class="actions">${editBtn('products',p.id)}</td></tr>`));if(tab==='chats')return out+toolbar()+table(['Conversa','Situação','Ações'],db.chats.filter(matches).map(p=>`<tr><td>${esc(p.name)}</td><td>${badge(p.status)}</td><td class="actions">${editBtn('chats',p.id)}</td></tr>`));return out+toolbar()+table(['Publicação','Autor','Situação','Ações'],db.posts.filter(matches).map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.author)}</td><td>${badge(p.status)}</td><td class="actions">${editBtn('posts',p.id)}</td></tr>`))}
function toolsView(){return heading('Ferramentas e APIs','Demonstre quais abas e integrações ficam habilitadas no aplicativo.')+`<div class="two">${[['modules','Abas do aplicativo','Controle a disponibilidade de cada ferramenta.'],['apis','Integrações e APIs','Controles simulados, sem chamadas a serviços externos.']].map(([kind,title,desc])=>`<section class="panel"><div class="panel-head"><h2>${title}</h2></div><div class="panel-body"><p class="sub">${desc}</p>${Object.entries(db[kind]).map(([n,on])=>`<div class="row"><div class="grow"><strong>${esc(n)}</strong><small>${on?'Habilitado':'Desabilitado'}</small></div><button class="toggle ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${esc(n)}" data-toggle="${kind}" data-name="${esc(n)}"><span></span></button></div>`).join('')}</div></section>`).join('')}</div><p class="help">Os controles mudam a demonstração e ficam salvos no cache. Não alteram aplicativos ou integrações reais.</p>`}
function communicationsView(){let titles={notifications:'Notificações',highlights:'Destaques',ads:'Publicidade e anúncios'};let out=heading('Comunicação e anúncios','Monte conteúdos de exemplo para usuários, parceiros e empresas.',newBtn(tab,'+ Criar '+(tab==='ads'?'anúncio':tab==='highlights'?'destaque':'notificação')))+tabs(titles)+toolbar();return out+table(tab==='ads'?['Anúncio','Anunciante / posição','Orçamento','Situação','Ações']:['Título','Público','Situação','Ações'],db[tab].filter(matches).map(p=>`<tr><td>${esc(p.title)}${p.message?`<small>${esc(p.message.slice(0,65))}</small>`:''}</td>${tab==='ads'?`<td>${esc(p.advertiser)}<small>${esc(p.placement)}</small></td><td>${money(p.budget)}</td>`:`<td>${esc(p.audience)}</td>`}<td>${badge(p.status)}</td><td class="actions">${editBtn(tab,p.id)}</td></tr>`))+`<p class="help">Tudo fica salvo como exemplo. Nenhuma notificação é enviada e nenhum anúncio é publicado fora desta página.</p>`}
function settingsView(){return heading('Configurações','Ajuste o nome do painel, a tabela de valores e as estimativas.',`<button class="btn" data-edit="settings">Editar configurações</button>`)+`<div class="two"><div class="panel"><div class="panel-head"><h2>Valores de referência</h2></div><div class="panel-body"><div class="row"><span>Valor base</span><strong>${money(db.settings.baseFare)}</strong></div><div class="row"><span>Valor por quilômetro</span><strong>${money(db.settings.perKm)}</strong></div><p class="help">Usados para sugerir valores de novas corridas. Corridas salvas mantêm os valores próprios.</p></div></div><div class="panel"><div class="panel-head"><h2>Estimativa mensal</h2></div><div class="panel-body"><div class="row"><span>Custo de operação</span><strong>${money(db.settings.monthlyCost)}</strong></div><div class="row"><span>Receita estimada</span><strong>${money(db.settings.monthlyRevenue)}</strong></div><p class="help">Valores fictícios preenchidos manualmente para demonstrar os indicadores do painel.</p></div></div></div><div class="panel" style="margin-top:20px"><div class="panel-body"><div class="row"><div class="grow"><strong>Cache da demonstração</strong><small>Restaurar remove apenas as alterações desta demo neste navegador.</small></div><button class="btn danger" data-act="reset">Restaurar dados</button></div></div></div>`}
function auditView(){return heading('Histórico de alterações','Acompanhe o que foi alterado nesta demonstração.')+table(['Quando','Alteração'],db.audit.map(a=>`<tr><td>${esc(new Date(a.at).toLocaleString('pt-BR'))}</td><td>${esc(a.action)}</td></tr>`))+`<p class="help">Histórico demonstrativo, salvo localmente com os últimos 100 eventos.</p>`}
const defs={users:[['name','Nome'],['email','E-mail fictício','email'],['role','Tipo',['Usuário','Parceiro']],['status','Aprovação',['PENDING','APPROVED','ACTIVE','REVOKED','BLOCKED']],['social','Perfil social',['ACTIVE','BLOCKED']],['marketplace','Perfil marketplace',['ACTIVE','PENDING','BLOCKED']]],companies:[['name','Empresa'],['city','Cidade'],['contact','Contato fictício','email'],['status','Aprovação',['PENDING','APPROVED','REVOKED','BLOCKED']]],rides:[['company','Empresa','companies'],['rider','Condutor'],['origin','Origem'],['destination','Destino'],['date','Data','date'],['km','Distância (km)','number'],['value','Valor da corrida (R$)','number'],['status','Situação',['OPEN','COMPLETED','CANCELED']],['payment','Pagamento',['OPEN','PAID']]],products:[['title','Produto'],['seller','Vendedor'],['price','Preço (R$)','number'],['status','Situação',['ACTIVE','PENDING','BLOCKED']]],posts:[['title','Conteúdo','textarea'],['author','Autor'],['status','Situação',['PUBLISHED','PENDING','BLOCKED']]],chats:[['name','Conversa'],['status','Situação',['OPEN','COMPLETED']]],notifications:[['title','Título'],['audience','Público',['Todos','Usuários','Parceiros','Empresas']],['message','Mensagem','textarea'],['status','Situação',['DRAFT','SCHEDULED']]],highlights:[['title','Título'],['audience','Público',['Todos','Usuários','Parceiros','Empresas']],['message','Conteúdo','textarea'],['status','Situação',['DRAFT','PUBLISHED','INACTIVE']]],ads:[['title','Anúncio'],['advertiser','Anunciante'],['placement','Posição',['Tela inicial','Marketplace','Social']],['budget','Orçamento (R$)','number'],['status','Situação',['DRAFT','ACTIVE','INACTIVE']]],settings:[['name','Nome do painel'],['baseFare','Valor base (R$)','number'],['perKm','Valor por km (R$)','number'],['monthlyCost','Custo mensal estimado (R$)','number'],['monthlyRevenue','Receita mensal estimada (R$)','number']]};
function editor(kind,id){let editing=kind==='settings'||!!id,item=kind==='settings'?clone(db.settings):id?clone(db[kind].find(x=>x.id===id)):{};if(kind==='rides'&&!id){item={company:companyFilter||db.companies[0]?.id,rider:'Condutor de exemplo',origin:'Origem de exemplo',destination:'Destino de exemplo',date,km:3,value:db.settings.baseFare+db.settings.perKm*3,status:'OPEN',payment:'OPEN'}}const fields=defs[kind];modal.innerHTML=`<form id="edit-form"><div class="dialog-head"><h2>${kind==='settings'?'Configurações':(editing?'Editar registro':'Novo registro')}</h2><button class="btn ghost" type="button" data-act="close" aria-label="Fechar">✕</button></div><div class="dialog-body">${fields.map(([key,title,type])=>{let val=item[key]??'',opts=type==='companies'?db.companies.map(c=>[c.id,c.name]):Array.isArray(type)?type.map(x=>[x,label(x)]):null;return`<label class="field" for="f-${key}">${title}${opts?`<select required id="f-${key}" name="${key}">${opts.map(([v,n])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(n)}</option>`).join('')}</select>`:type==='textarea'?`<textarea required maxlength="2000" id="f-${key}" name="${key}">${esc(val)}</textarea>`:`<input required id="f-${key}" name="${key}" type="${type||'text'}" ${type==='number'?'min="0" max="100000000" step="0.01"':''} ${type==='text'||!type?'maxlength="150"':''} value="${esc(val)}">`}</label>`}).join('')}<p class="help">Dados demonstrativos. Use apenas informações fictícias.</p></div><div class="dialog-foot"><button type="button" class="btn secondary" data-act="close">Cancelar</button><button type="submit" class="btn">Salvar alterações</button></div></form>`;modal.showModal();document.getElementById('edit-form').onsubmit=e=>{e.preventDefault();const values=new FormData(e.target);for(const [key,,type]of fields){item[key]=type==='number'?Number(values.get(key)):String(values.get(key)||'').trim()}if(kind==='settings')db.settings=item;else if(id){db[kind][db[kind].findIndex(x=>x.id===id)]=item}else{item.id=kind[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,7);db[kind].push(item)}modal.close();save(`${editing?'Editado':'Criado'}: ${item.name||item.title||(kind==='rides'?'corrida de '+item.rider:'registro')}.`)};}
function confirmReset(){modal.innerHTML=`<div class="dialog-head"><h2>Restaurar demonstração?</h2></div><div class="dialog-body"><p>As alterações desta demo serão substituídas pelos exemplos iniciais neste navegador.</p></div><div class="dialog-foot"><button class="btn secondary" data-act="close">Cancelar</button><button class="btn danger" data-act="confirm-reset">Restaurar</button></div>`;modal.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)return go(b.dataset.page);if(b.dataset.edit)return editor(b.dataset.edit,b.dataset.id);if(b.dataset.tab){tab=b.dataset.tab;query='';return render()}if(b.dataset.company){page='rides';companyFilter=b.dataset.company;query='';statusFilter='';return render()}if(b.dataset.approve){let u=db[b.dataset.approve].find(x=>x.id===b.dataset.id);u.status='APPROVED';return save('Aprovação concedida: '+u.name+'.')}if(b.dataset.toggle){const k=b.dataset.toggle,n=b.dataset.name;db[k][n]=!db[k][n];return save(n+': '+(db[k][n]?'habilitado':'desabilitado')+'.')}switch(b.dataset.act){case'enter':entered=true;try{localStorage.setItem(KEY,JSON.stringify(db))}catch{cacheOK=false}render();break;case'exit':entered=false;login();break;case'close':modal.close();break;case'menu':document.getElementById('sidebar').classList.toggle('open');break;case'reset':confirmReset();break;case'confirm-reset':db=seed();modal.close();page='overview';save('Dados da demonstração restaurados.');break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;document.getElementById('view').innerHTML=view();const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='company-filter'){companyFilter=e.target.value;render()}if(e.target.id==='status-filter'){statusFilter=e.target.value;render()}});
login();
</script>
</html>
